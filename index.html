<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UIU Study Tracker</title>
<style>
:root{--bg:#f1f4f9;--c:#fff;--t:#14213d;--m:#5b6784;--a:#2f5bea;--l:#dde3ee;--w:#b45309;--s1:#f5c542;--s2:#7fb2ff;--s3:#5fd39a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--c:#18203a;--t:#e8ecf7;--m:#98a3c2;--a:#7da0ff;--l:#2b3558;--w:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--c:#18203a;--t:#e8ecf7;--m:#98a3c2;--a:#7da0ff;--l:#2b3558;--w:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px 84px}
main{max-width:640px;margin:0 auto;padding-top:14px}
h2{margin:6px 0 10px;font-size:20px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin:0 0 10px}
.tap{cursor:pointer}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.m{color:var(--m);font-size:13px}.w{color:var(--w);font-size:13px}.big{font-size:42px;font-weight:700;line-height:1}
input,select,textarea,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:8px 10px;margin:4px 0;max-width:100%}
input,textarea{width:100%}textarea{min-height:80px}
.row input,.row select{width:auto;flex:1;min-width:90px}
button{cursor:pointer;background:var(--c)}button.pri{background:var(--a);color:#fff;border-color:var(--a);width:100%;padding:11px;font-weight:600}
.chip{border-radius:20px;padding:3px 10px;font-size:12.5px;background:var(--l);color:var(--t);border:0;margin:0}
.chip.s1{background:var(--s1);color:#14213d}.chip.s2{background:var(--s2);color:#14213d}.chip.s3{background:var(--s3);color:#14213d}
.x{border:0;background:none;color:var(--m);font-size:20px;padding:0 6px}
.bar{display:flex;height:8px;border-radius:4px;background:var(--l);overflow:hidden;margin:8px 0 4px}.bar i{display:block}
.bar .s1{background:var(--s1)}.bar .s2{background:var(--s2)}.bar .s3{background:var(--s3)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 0;border-bottom:1px solid var(--l)}
a{color:var(--a)}label{font-size:13px;color:var(--m)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;margin:0;padding:10px 4px;font-weight:600;color:var(--m)}nav button.on{color:var(--a)}
</style></head><body><main id="app"></main>
<nav><button id="n_home" onclick="go('home')">Courses</button><button id="n_dl" onclick="go('dl')">Deadlines</button><button id="n_bk" onclick="go('bk')">Backup</button></nav>
<script>
const CAT=`1|ENG 1011|English I|3|
1|BDS 1201|History of the Emergence of Bangladesh|2|
1|CSE 1110|Introduction to Computer Systems|1|
1|MATH 1151|Fundamental Calculus|3|
2|ENG 1013|English II|3|
2|CSE 1111|Structured Programming Language|3|CSE 1110
2|CSE 1112|Structured Programming Language Lab|1|CSE 1110
2|CSE 2213|Discrete Mathematics|3|
3|MATH 2183|Calculus and Linear Algebra|3|MATH 1151
3|PHY 2105|Physics|3|
3|PHY 2106|Physics Lab|1|
3|CSE 2215|Data Structure and Algorithms I|3|CSE 1111
3|CSE 2216|Data Structure and Algorithms I Lab|1|CSE 1112
4|MATH 2201|Coordinate Geometry and Vector Analysis|3|MATH 1151
4|CSE 1325|Digital Logic Design|3|
4|CSE 1326|Digital Logic Design Lab|1|
4|CSE 1115|Object Oriented Programming|3|CSE 2215
4|CSE 1116|Object Oriented Programming Lab|1|CSE 2216
5|MATH 2205|Probability and Statistics|3|MATH 1151
5|SOC 2101|Society, Environment and Engineering Ethics|3|
5|CSE 2217|Data Structure and Algorithms II|3|CSE 2215
5|CSE 2218|Data Structure and Algorithms II Lab|1|CSE 2216
5|EEE 2113|Electrical Circuits|3|
6|CSE 3521|Database Management Systems|3|CSE 2215
6|CSE 3522|Database Management Systems Lab|1|CSE 2216
6|CSE 4165|Web Programming|3|CSE 1115,CSE 1116
6|EEE 2123|Electronics|3|EEE 2113
6|EEE 2124|Electronics Lab|1|
7|CSE 3313|Computer Architecture|3|CSE 1325
7|CSE 2118|Advanced Object Oriented Programming Lab|1|CSE 1116
7|BIO 3105|Biology for Engineers|3|
7|CSE 3411|System Analysis and Design|3|CSE 3521
7|CSE 3412|System Analysis and Design Lab|1|CSE 3522
8|CSE 4325|Microprocessors and Microcontrollers|3|CSE 3313
8|CSE 4326|Microprocessors and Microcontrollers Lab|1|EEE 2124
8|CSE 3421|Software Engineering|3|CSE 3411
8|CSE 3422|Software Engineering Lab|1|CSE 3412
8|CSE 3811|Artificial Intelligence|3|MATH 2205,CSE 2217
8|CSE 3812|Artificial Intelligence Lab|1|MATH 2205,CSE 2218
9|CSE 2233|Theory of Computation|3|
9|PMG 4101|Project Management|3|CSE 3411
9|CSE 3711|Computer Networks|3|CSE 2217
9|CSE 3712|Computer Networks Lab|1|
9|CSE 4889|Machine Learning|3|CSE 3811,CSE 3812,MATH 2183
10|CSE 4000A|Final Year Design Project I|2|
10|CSE 4509|Operating Systems|3|CSE 2217,CSE 3313
10|CSE 4510|Operating Systems Lab|1|CSE 2218
11|CSE 4000B|Final Year Design Project II|2|CSE 4000A
11|CSE 4531|Computer Security|3|CSE 3711,CSE 4509
12|CSE 4000C|Final Year Design Project III|2|CSE 4000A,CSE 4000B
12|EEE 4261|Green Computing|3|`.split("\n").map(l=>{const[a,b,c,d,e]=l.split("|");return{tri:+a,code:b,title:c,cr:+d,pre:e?e.split(","):[]}});
const G=[[90,"A",4],[86,"A-",3.67],[82,"B+",3.33],[78,"B",3],[74,"B-",2.67],[70,"C+",2.33],[66,"C",2],[62,"C-",1.67],[58,"D+",1.33],[55,"D",1],[0,"F",0]];
const ST=["Not started","Learning","Revised","Mastered"],GR=["Attendance","Assignments","Class Tests","Midterm","Final"];
const T1=["Basic C program structure, variables, data types, input/output","Operators, expressions, math.h","Decision making: if, if-else, else-if ladder, switch","Loops: for, while, do-while, break, continue","Series and pattern problems","Arrays","2-D arrays and matrix operations","User defined functions","Strings and string functions","Structures","Pointers","File I/O","Recursion","Function and structure problems"];
let S=null,V={v:"home",t:1};
try{S=JSON.parse(localStorage.getItem("uiu")||"null")}catch(e){}
S=S||{courses:[],dl:[]};
const save=()=>{try{localStorage.setItem("uiu",JSON.stringify(S))}catch(e){}};
const $=s=>document.getElementById(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today=()=>new Date(new Date().setHours(0,0,0,0)),left=d=>Math.round((new Date(d+"T00:00")-today())/864e5);
const pg=c=>c.tp.length?c.tp.reduce((a,t)=>a+t.s,0)/(3*c.tp.length)*100:0;
const gpOf=l=>(G.find(g=>g[1]===l)||[0,0,0])[2],gradeOf=p=>G.find(g=>Math.round(p)>=g[0]);
const seg=c=>{const n=c.tp.length||1,w=k=>c.tp.filter(t=>t.s===k).length/n*100;return `<div class="bar"><i class="s3" style="width:${w(3)}%"></i><i class="s2" style="width:${w(2)}%"></i><i class="s1" style="width:${w(1)}%"></i></div>`};
const mk=o=>({code:o.code,title:o.title,cr:o.cr,tri:o.tri||0,tp:[],w:{Attendance:5,Assignments:5,"Class Tests":20,Midterm:30,Final:40},i:[],start:"",fin:"",gr:""});
function calc(c){let e=0,u=0,T=0;for(const g of GR){T+=c.w[g];const it=c.i.filter(x=>x.g===g),f=it.reduce((a,x)=>a+x.f,0);if(it.length&&f>0){e+=it.reduce((a,x)=>a+x.o,0)/f*c.w[g];u+=c.w[g]}}return{e,u,T,r:T-u,p:u?e/u*100:null}}
function cal(t,d){const[y,m,k]=d.split("-").map(Number),n=new Date(Date.UTC(y,m-1,k+1)).toISOString().slice(0,10).replace(/-/g,"");return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+d.replace(/-/g,"")+"/"+n}
function go(v,i){V={v,i,t:V.t};render();scrollTo(0,0)}
function render(){const v=V.v;$("app").innerHTML=({home,add,course,dl,bk}[v]||home)();["home","dl","bk"].forEach(k=>$("n_"+k).className=(v===k||(k==="home"&&(v==="add"||v==="course")))?"on":"")}
function home(){const g=S.courses.filter(c=>c.gr),cr=g.reduce((a,c)=>a+c.cr,0),pts=g.reduce((a,c)=>a+gpOf(c.gr)*c.cr,0),cg=cr?pts/cr:null,rem=141-cr,need=S.tg&&rem>0?(S.tg*141-pts)/rem:null;
return `<div class="card"><div class="big">${cg===null?"–":cg.toFixed(2)}</div><div class="m">CGPA from ${cr} of 141 credits</div>
<div class="row"><label>Target CGPA</label><input id="tg" type="number" step="0.01" value="${S.tg||""}"><button onclick="setTg()">Set</button></div>
${need===null?"":`<p class="m">${need>4?"This target is not reachable with the remaining credits.":"You need about "+Math.max(need,0).toFixed(2)+" GPA on the remaining "+rem+" credits."}</p>`}</div>`+
(S.courses.length?"":`<p class="m">No courses yet. Add the courses you are taking this trimester.</p>`)+
S.courses.map((c,i)=>{const p=calc(c).p;return `<div class="card tap" onclick="go('course',${i})"><div class="row"><b>${E(c.code)}</b><span class="chip">${c.gr||(p===null?"no marks yet":"projected "+gradeOf(p)[1])}</span></div><div>${E(c.title)}</div>${seg(c)}<div class="m">${Math.round(pg(c))}% of topics done, ${c.cr} credits</div></div>`}).join("")+`<button class="pri" onclick="go('add')">Add course</button>`}
function setTg(){S.tg=+$("tg").value||0;save();render()}
function add(){const t=V.t,have=S.courses.map(c=>c.code);
return `<h2>Add course</h2><select onchange="V.t=+this.value;render()">${[...Array(12)].map((_,k)=>`<option value="${k+1}" ${k+1===t?"selected":""}>Trimester ${k+1}</option>`).join("")}</select>`+
CAT.filter(c=>c.tri===t).map(c=>{const miss=c.pre.filter(p=>{const x=S.courses.find(y=>y.code===p);return !x||!x.gr||x.gr==="F"});return `<div class="card"><div class="row"><div><b>${c.code}</b> ${c.title}<div class="m">${c.cr} credits</div>${miss.length?`<div class="w">Prerequisite not completed: ${miss.join(", ")}</div>`:""}</div>${have.includes(c.code)?`<span class="chip">added</span>`:`<button onclick="addC('${c.code}')">Add</button>`}</div></div>`}).join("")+
`<div class="card"><b>Elective, general education or other</b><input id="xc" placeholder="Code, for example CSE 4811"><input id="xt" placeholder="Title"><input id="xr" type="number" value="3"><button class="pri" onclick="addX()">Add this course</button></div><button onclick="go('home')">Back</button>`}
function addC(code){const o=CAT.find(c=>c.code===code),c=mk(o);if(code==="CSE 1111")c.tp=T1.map(t=>({t,s:0}));S.courses.push(c);save();go("home")}
function addX(){const code=$("xc").value.trim(),t=$("xt").value.trim();if(!code||!t)return;S.courses.push(mk({code,title:t,cr:+$("xr").value||3}));save();go("home")}
function course(){const c=S.courses[V.i],k=calc(c),pr=pg(c);let pace="";
if(c.start&&c.fin){const a=new Date(c.start+"T00:00"),b=new Date(c.fin+"T00:00"),tp=Math.min(1,Math.max(0,(today()-a)/(b-a)))*100,late=pr+10<tp;pace=`<p class="${late?"w":"m"}">${Math.round(tp)}% of the time has passed and ${Math.round(pr)}% of topics are done${late?", so you are behind schedule":""}. Final exam in ${left(c.fin)} days.</p>`}
const need=G.slice(0,10).map(g=>{const min=g[0]/100*k.T,x=k.r>0?(min-k.e)/k.r*100:null;return `<tr><td>${g[1]}</td><td>${x===null?(k.e>=min?"achieved":"not reachable"):x<=0?"secured":x>100?"not reachable":"need "+x.toFixed(0)+"% on the remaining marks"}</td></tr>`}).join("");
return `<button onclick="go('home')">Back</button><h2>${E(c.code)} ${E(c.title)}</h2>
<div class="card"><div class="row"><label>Start</label><input type="date" id="cs" value="${c.start}"><label>Final exam</label><input type="date" id="cf" value="${c.fin}"></div><button onclick="saveD()">Save dates</button>${pace}</div>
<h3>Topics</h3><div class="card">${seg(c)}${c.tp.map((t,j)=>`<div class="row"><span>${E(t.t)}</span><span><button class="chip s${t.s}" onclick="cyc(${j})">${ST[t.s]}</button><button class="x" onclick="delT(${j})">×</button></span></div>`).join("")||`<p class="m">No topics yet. Add them below.</p>`}
<input id="nt" placeholder="New topic"><button onclick="addT()">Add topic</button><textarea id="bt" placeholder="Paste many topics, one per line"></textarea><button onclick="addB()">Add all lines</button></div>
<h3>Marks</h3><div class="card"><div class="row">${GR.map((g,n)=>`<label>${g}<input id="w${n}" type="number" value="${c.w[g]}"></label>`).join("")}</div><button onclick="saveW()">Save weights</button>
${c.i.map((x,j)=>`<div class="row"><span>${x.g}: ${E(x.n)} ${x.o}/${x.f}</span><button class="x" onclick="delI(${j})">×</button></div>`).join("")}
<div class="row"><select id="ig">${GR.map(g=>`<option>${g}</option>`).join("")}</select><input id="in" placeholder="Name, for example CT1"></div><div class="row"><input id="io" type="number" placeholder="Marks obtained"><input id="iff" type="number" placeholder="Out of"></div><button onclick="addI()">Add marks</button>
<p>${k.u?`Earned ${k.e.toFixed(1)} of ${k.u} assessed marks (${k.T} in total). Projected grade ${gradeOf(k.p)[1]} at ${k.p.toFixed(1)}%.`:"Add marks to see your projected grade."}</p>
<table>${need}</table></div>
<h3>Final grade</h3><div class="card"><div class="row"><select id="fg"><option value="">Not decided</option>${G.map(g=>`<option ${c.gr===g[1]?"selected":""}>${g[1]}</option>`).join("")}</select><button onclick="saveG()">Save grade</button></div></div>
<button onclick="delC()">Remove this course</button>`}
const C=()=>S.courses[V.i],done=()=>{save();render()};
function saveD(){C().start=$("cs").value;C().fin=$("cf").value;done()}
function cyc(j){const t=C().tp[j];t.s=(t.s+1)%4;done()}
function delT(j){C().tp.splice(j,1);done()}
function addT(){const v=$("nt").value.trim();if(v)C().tp.push({t:v,s:0});done()}
function addB(){$("bt").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(t=>C().tp.push({t,s:0}));done()}
function saveW(){GR.forEach((g,n)=>C().w[g]=+$("w"+n).value||0);done()}
function addI(){const o=parseFloat($("io").value),f=parseFloat($("iff").value);if(isNaN(o)||!(f>0))return;C().i.push({g:$("ig").value,n:$("in").value.trim(),o,f});done()}
function delI(j){C().i.splice(j,1);done()}
function saveG(){C().gr=$("fg").value;done()}
function delC(){S.courses.splice(V.i,1);save();go("home")}
function dl(){const a=[...S.dl.map((d,i)=>({...d,i})),...S.courses.filter(c=>c.fin).map(c=>({t:"Final exam: "+c.code,d:c.fin,auto:1}))].sort((x,y)=>x.d.localeCompare(y.d));
return `<h2>Deadlines</h2><div class="card"><input id="dt" placeholder="What is due, for example CSE 1111 Midterm"><input id="dd" type="date"><button class="pri" onclick="addD()">Add deadline</button></div>`+
(a.length?"":`<p class="m">No deadlines yet. Final exam dates you set on a course appear here automatically.</p>`)+
a.map(x=>{const n=left(x.d);return `<div class="card"><div class="row"><div><b>${E(x.t)}</b><div class="${n>=0&&n<=3?"w":"m"}">${x.d}, ${n<0?Math.abs(n)+" days ago":n===0?"today":n+" days left"}</div></div>${x.auto?"":`<button class="x" onclick="delD(${x.i})">×</button>`}</div><a href="${cal(x.t,x.d)}" target="_blank" rel="noopener">Add to phone calendar for an alarm</a></div>`}).join("")}
function addD(){const t=$("dt").value.trim(),d=$("dd").value;if(!t||!d)return;S.dl.push({t,d});done()}
function delD(i){S.dl.splice(i,1);done()}
function bk(){return `<h2>Backup</h2><div class="card"><p>Everything is saved only on this device. Copy a backup now and then, and keep it in Notes or Drive.</p><button onclick="exp()">Copy backup</button><textarea id="bx" placeholder="Backup text appears here. To restore, paste it here and tap Restore."></textarea><button onclick="imp()">Restore from text</button><p id="bm" class="m"></p></div><div class="card"><b>Install on your phone</b><p class="m">Open this page in Chrome or Safari, open the browser menu and choose Add to Home screen.</p></div>`}
function exp(){const x=$("bx");x.value=JSON.stringify(S);x.select();try{navigator.clipboard.writeText(x.value)}catch(e){}$("bm").textContent="Backup ready. Copy it if it was not copied automatically."}
function imp(){try{const o=JSON.parse($("bx").value);if(!Array.isArray(o.courses))throw 0;S=o;save();go("home")}catch(e){$("bm").textContent="That text is not a valid backup."}}
render();
</script></body></html>
